services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ccdev
      DB_USER: ccdev
      DB_PASS: ccdev
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
